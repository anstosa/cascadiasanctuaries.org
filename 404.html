<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta name="theme-color" content="#17382d">
    <link rel="icon" href="/static/media/cascadia-favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="canonical" href="https://cascadiasanctuaries.org/">

    <style>
      /* center the error state */
      body {
        align-items: center;
        background: #f6f4ed;
        color: #17382d;
        display: flex;
        font-family: Arial, sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;

      /* constrain the message */

      p {

      <p>404</p>
      <h1>This path is still finding its footing.</h1>
